name: Node.js CI
permissions:
  contents: read

on:
  push:
    branches: ['main']
    tags: ['*']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - &node-setup
        name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - &install-dependencies
        name: Install dependencies
        run: yarn install --immutable

      - name: Build code
        run: yarn run build

      - uses: actions/upload-artifact@v7
        with: &build-artifact
          name: package-build
          path: dist/

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node-setup
      - *install-dependencies

      - name: Lint code
        run: yarn eslint .

      - name: Prettier check
        run: yarn run format --check

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node-setup
      - *install-dependencies

      - name: Test code
        run: yarn test

      - uses: actions/upload-artifact@v7
        with: &test-coverage-artifact
          name: test-coverage
          path: coverage/

  sonar:
    name: SonarQube Scan
    needs: [unit-test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - *node-setup
      - *install-dependencies

      - name: Download package build
        uses: actions/download-artifact@v8
        with: *build-artifact

      - name: Download test coverage
        uses: actions/download-artifact@v8
        with: *test-coverage-artifact

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-test:
    name: Integration tests (${{ matrix.os }}, node ${{ matrix.node }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['latest', '22.14.0']
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - *install-dependencies

      - name: Download package build
        uses: actions/download-artifact@v8
        with: *build-artifact

      - name: Run integration tests
        run: yarn run test:integration

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, lint, unit-test, sonar, integration-test]
    steps:
      - *node-setup

      - name: Download package build
        uses: actions/download-artifact@v8
        with: *build-artifact

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
